<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&display=block">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:540px;height:992px;background:transparent;overflow:hidden;font-family:'IBM Plex Mono','Courier New',monospace;-webkit-font-smoothing:none;}
.bezel{position:absolute;left:0;top:0;width:540px;height:992px;background:#111111;border-radius:12px;box-shadow:inset 0 0 0 1px #262626}
.lcd{position:absolute;left:12px;top:16px;width:516px;height:960px;background:#000;overflow:hidden}
/* zones */
.hdr{position:absolute;left:0;top:0;width:516px;height:60px;background:#FFFFFF}
.cnt{position:absolute;left:0;top:60px;width:516px;height:648px;background:#000000}
.sts{position:absolute;left:0;top:708px;width:516px;height:192px;background:#0C0C18}
.tch{position:absolute;left:0;top:900px;width:516px;height:60px;background:#0C0C18;border-top:3px solid #202020}
/* text helpers */
.sm{position:absolute;white-space:pre;font-size:24px;line-height:24px;letter-spacing:2px;font-weight:500}
.lg{position:absolute;white-space:pre;font-size:48px;line-height:48px;letter-spacing:4px;font-weight:700}
.hl{position:absolute;left:0;width:516px;height:3px}
.btn{position:absolute;top:6px;height:48px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;letter-spacing:2px}
</style></head><body>
<div class="bezel"></div>
<div class="lcd">

  <!-- HEADER -->
  <div class="hdr">
    <span class="sm" style="left:12px;top:17px;color:#183060;font-weight:700">Add Wi-Fi</span>
    <img src="logo_icon_3x.png" style="position:absolute;right:30px;top:3px;width:69px;height:54px;image-rendering:pixelated" alt="logo">
    <div style="position:absolute;left:0;bottom:0;width:516px;height:3px;background:#F07C20"></div>
  </div>

  <!-- CONTENT — character picker wheel -->
  <div class="cnt">

    <!-- SSID line y=2 -->
    <span class="sm" style="left:6px;top:6px;color:#787878">SSID: HMS-Delft-Cre_</span>

    <!-- Password field y=14 — shows 'N' just added -->
    <span class="sm" style="left:6px;top:42px;color:#FFFFFF">MyPi1234N<span style="background:#FFFFFF;color:#000">&nbsp;</span></span>

    <!-- separator y=24 -->
    <div class="hl" style="top:72px;background:#202020"></div>

    <!-- Range tabs y=26 — 7 tabs, "az" active (orange) -->
    <!-- tabW = 516/7 ≈ 73px -->
    <div style="position:absolute;top:75px;left:0;width:516px;height:36px">
      <!-- az ACTIVE -->
      <div style="position:absolute;left:0;top:0;width:72px;height:36px;background:#F07C20;display:flex;align-items:center;justify-content:center">
        <span style="font-size:21px;font-weight:700;color:#000;font-family:'IBM Plex Mono',monospace">az</span>
      </div>
      <!-- AZ -->
      <div style="position:absolute;left:73px;top:0;width:72px;height:36px;background:#0C0C18;display:flex;align-items:center;justify-content:center">
        <span style="font-size:21px;color:#787878;font-family:'IBM Plex Mono',monospace">AZ</span>
      </div>
      <!-- 09 -->
      <div style="position:absolute;left:146px;top:0;width:72px;height:36px;background:#0C0C18;display:flex;align-items:center;justify-content:center">
        <span style="font-size:21px;color:#787878;font-family:'IBM Plex Mono',monospace">09</span>
      </div>
      <!-- S1 -->
      <div style="position:absolute;left:219px;top:0;width:72px;height:36px;background:#0C0C18;display:flex;align-items:center;justify-content:center">
        <span style="font-size:21px;color:#787878;font-family:'IBM Plex Mono',monospace">S1</span>
      </div>
      <!-- S2 -->
      <div style="position:absolute;left:292px;top:0;width:72px;height:36px;background:#0C0C18;display:flex;align-items:center;justify-content:center">
        <span style="font-size:21px;color:#787878;font-family:'IBM Plex Mono',monospace">S2</span>
      </div>
      <!-- I1 -->
      <div style="position:absolute;left:365px;top:0;width:72px;height:36px;background:#0C0C18;display:flex;align-items:center;justify-content:center">
        <span style="font-size:21px;color:#787878;font-family:'IBM Plex Mono',monospace">I1</span>
      </div>
      <!-- I2 -->
      <div style="position:absolute;left:438px;top:0;width:77px;height:36px;background:#0C0C18;display:flex;align-items:center;justify-content:center">
        <span style="font-size:21px;color:#787878;font-family:'IBM Plex Mono',monospace">I2</span>
      </div>
    </div>

    <!-- separator y=40 -->
    <div class="hl" style="top:120px;background:#202020"></div>

    <!-- hint line y=42 -->
    <span class="sm" style="left:0;right:0;top:126px;color:#787878;text-align:center;width:516px;display:block;text-align:center;font-size:21px">&lt; range &gt;&nbsp;&nbsp;&nbsp;^ char v</span>

    <!-- separator y=52 -->
    <div class="hl" style="top:156px;background:#202020"></div>

    <!-- CHARACTER WHEEL — starts y=55 (165px in content)
         slot -2: dim, 20px high  → y=165, h=59px
         slot -1: dim, 20px high  → y=225, h=59px  (with ^ hint at right)
         slot  0: CURRENT, 32px   → y=285, h=96px   highlighted, large
         slot +1: dim, 20px high  → y=381, h=59px  (with v hint at right)
         slot +2: dim, 20px high  → y=441, h=59px
    -->

    <!-- slot -2: 'l' dim -->
    <div style="position:absolute;left:0;top:165px;width:516px;height:59px;background:#000">
      <span style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:24px;color:#787878;font-family:'IBM Plex Mono',monospace">l</span>
    </div>

    <!-- slot -1: 'm' dim + ^ hint -->
    <div style="position:absolute;left:0;top:225px;width:516px;height:59px;background:#000">
      <span style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:24px;color:#787878;font-family:'IBM Plex Mono',monospace">m</span>
      <span style="position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:24px;color:#787878;font-family:'IBM Plex Mono',monospace">^</span>
    </div>

    <!-- slot 0: 'n' CURRENT — orange border, navy bg, large orange letter -->
    <div style="position:absolute;left:0;top:285px;width:516px;height:96px;background:#001040;border:3px solid #F07C20;box-sizing:border-box">
      <span style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:48px;font-weight:700;color:#F07C20;font-family:'IBM Plex Mono',monospace">n</span>
    </div>

    <!-- slot +1: 'o' dim + v hint -->
    <div style="position:absolute;left:0;top:381px;width:516px;height:59px;background:#000">
      <span style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:24px;color:#787878;font-family:'IBM Plex Mono',monospace">o</span>
      <span style="position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:24px;color:#787878;font-family:'IBM Plex Mono',monospace">v</span>
    </div>

    <!-- slot +2: 'p' dim -->
    <div style="position:absolute;left:0;top:441px;width:516px;height:59px;background:#000">
      <span style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:24px;color:#787878;font-family:'IBM Plex Mono',monospace">p</span>
    </div>

  </div><!-- end content -->

  <!-- STATUS BAR -->
  <div class="sts">
    <!-- UART waveform (decorative) -->
    <svg style="position:absolute;left:3px;top:4px" width="510" height="15" shape-rendering="crispEdges">
      <polyline points="0,12 17,12 17,2 34,2 51,2 51,12 68,12 85,12 102,12 119,12 136,12 153,2 170,2 187,2 204,12 221,12 238,12 255,2 272,2 289,12 306,12 323,12 340,2 357,2 374,12 391,12 408,12 425,2 442,2 459,12 476,12 476,2 510,2"
        fill="none" stroke="#00FF00" stroke-width="3"/>
    </svg>
    <span class="lg" style="left:12px;top:42px;color:#00FF00">192.168.1.42</span>
    <span class="sm" style="left:12px;top:96px;color:#787878">HMS-Delft-Crew</span>
    <div style="position:absolute;left:12px;top:123px;width:492px;height:3px;background:#787878"></div>
    <span class="sm" style="left:12px;top:132px;color:#00FF00">Pi wlan0: 192.168.1.7</span>
    <span class="sm" style="left:12px;top:165px;color:#787878">HMS-Delft-Crew</span>
  </div>

  <!-- TOUCH BAR — 3 zones: NEXT | DEL | OK -->
  <div class="tch">
    <div class="btn" style="left:6px;width:160px;background:#001040;color:#FFFFFF">NEXT</div>
    <div class="btn" style="left:172px;width:160px;background:#001040;color:#FF0000">DEL</div>
    <div class="btn" style="left:338px;width:172px;background:#F07C20;color:#000000">OK</div>
  </div>

</div><!-- end lcd -->
</body></html>
